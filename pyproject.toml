[project]
name = "sure-auto-categorizer"
version = "0.1.0"
description = "Auto-categorize Sure Finance transactions with an LLM"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.7.1",
    "tenacity>=9.0.0",
]

[project.scripts]
sure-auto-categorizer = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
